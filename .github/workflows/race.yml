name: Update $250 race

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      after:
        description: "Start date, YYYY-MM-DD (UTC). Blank = 2026-11-10"
        required: false
      before:
        description: "End date, YYYY-MM-DD (UTC). Blank = 2026-11-17"
        required: false

permissions:
  contents: write

concurrency:
  group: race-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch race standings
        env:
          GAMDOM_API_KEY: ${{ secrets.GAMDOM_API_KEY }}
          RACE_AFTER: ${{ github.event.inputs.after }}
          RACE_BEFORE: ${{ github.event.inputs.before }}
        run: python3 scripts/fetch_race.py
      - name: Commit if changed
        run: |
          git config user.name "race-bot"
          git config user.email "race-bot@users.noreply.github.com"
          git add public/race.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Update race standings"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
